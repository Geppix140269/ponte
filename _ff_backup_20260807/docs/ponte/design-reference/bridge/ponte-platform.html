<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ponte, the platform</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&family=Amiri:wght@400;700&family=Noto+Sans+Arabic:wght@300;400&family=Noto+Serif+SC:wght@400&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#0E0F0C;--cream:#F2EFE6;--bronze:#C79A4C;--bronze-deep:#8A6520;
  --checked:#5E9B78;--unproved:#C4664E;--waiting:#C79A4C;
  --serif:"Playfair Display",Georgia,serif;--sans:"Inter",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
  --tr:.28em;--th:-.024em;--ease:cubic-bezier(.19,1,.22,1);--rule:rgba(242,239,232,.12);
  --pad:40px;
}
html[lang="ar"]{--serif:"Amiri",Georgia,serif;--sans:"Noto Sans Arabic",system-ui,sans-serif;--mono:"Noto Sans Arabic",monospace;--tr:0;--th:0}
html[lang="zh"]{--serif:"Noto Serif SC",Georgia,serif;--sans:"Noto Sans SC",system-ui,sans-serif;--mono:"Noto Sans SC",monospace;--tr:.06em;--th:0}
@media(max-width:899px){:root{--pad:22px}}

html,body{height:100%}
body{background:var(--ink);color:var(--cream);font-family:var(--sans);overflow-x:hidden}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.14;mix-blend-mode:overlay;z-index:80}
.mx{max-width:1560px;margin:0 auto;padding:0 var(--pad)}

/* ================= chrome ================= */
header{position:sticky;top:0;z-index:40;background:var(--ink)}
.hbar{height:60px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.mark{font-family:var(--mono);font-size:11px;letter-spacing:.46em;text-transform:uppercase;cursor:pointer}
html[lang="ar"] .mark,html[lang="zh"] .mark{letter-spacing:var(--tr)}
.hnav{display:flex;gap:28px}
.hnav a{font-family:var(--mono);font-size:9.5px;letter-spacing:var(--tr);text-transform:uppercase;color:rgba(242,239,232,.44);text-decoration:none;cursor:pointer;transition:color 240ms;white-space:nowrap}
.hnav a.on,.hnav a:hover{color:var(--bronze)}
.who{font-family:var(--mono);font-size:9.5px;letter-spacing:var(--tr);text-transform:uppercase;opacity:.42;white-space:nowrap}
@media(max-width:899px){.hnav{display:none}}

/* the tape: global, never stops */
.tape{position:sticky;top:60px;z-index:39;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--ink);height:32px;overflow:hidden;display:flex;align-items:center}
.tmask{position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(to right,var(--ink),transparent 46px,transparent calc(100% - 46px),var(--ink))}
.trun{display:flex;white-space:nowrap;animation:run 52s linear infinite}
.trun:hover{animation-play-state:paused}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(-50%)}}
html[dir="rtl"] .trun{animation-direction:reverse}
.ti{display:inline-flex;align-items:baseline;gap:9px;padding:0 20px;font-family:var(--mono);font-size:9.5px;letter-spacing:var(--tr);text-transform:uppercase;opacity:.55}
.ti b{font-weight:500;opacity:.95}.ti .u{color:var(--bronze)}
.ti i{width:3px;height:3px;background:var(--checked);border-radius:50%;display:inline-block;animation:blip 2.6s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:.25}50%{opacity:1}}

/* ================= shared ================= */
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:var(--tr);text-transform:uppercase;color:var(--bronze)}
h1{font-family:var(--serif);font-weight:400;letter-spacing:var(--th);line-height:.98;font-size:58px;max-width:12ch}
h1 em{font-style:italic;color:var(--bronze)}
html[lang="zh"] h1 em,html[lang="ar"] h1 em{font-style:normal}
@media(max-width:899px){h1{font-size:40px;max-width:14ch;line-height:1.04}}
h2{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.06;letter-spacing:var(--th)}
h2 em{font-style:italic;color:var(--bronze)}
.sechead{font-family:var(--mono);font-size:9.5px;letter-spacing:var(--tr);text-transform:uppercase;color:var(--bronze);display:flex;justify-content:space-between;margin-bottom:16px}
.sechead span:last-child{color:var(--cream);opacity:.34}
.note{font-size:11px;opacity:.4;margin-top:14px;line-height:1.6;font-weight:300;max-width:46ch}

/* the arc band */
.band{padding-top:16px}
.bandhead{display:flex;align-items:flex-end;justify-content:space-between;gap:60px}
.now{max-width:400px;padding-bottom:6px}
.now .k{font-family:var(--mono);font-size:9px;letter-spacing:var(--tr);text-transform:uppercase;color:var(--bronze)}
.now .t{font-family:var(--serif);font-size:21px;line-height:1.25;margin-top:8px}
.now .d{font-size:12.5px;opacity:.5;margin-top:7px;line-height:1.55;font-weight:300}
@media(max-width:899px){.bandhead{flex-direction:column;align-items:flex-start;gap:20px}.now{max-width:none}}
.arcwrap{height:196px;margin-top:6px;position:relative}
@media(max-width:899px){.arcwrap{height:128px}}
.arcwrap svg{width:100%;height:100%;overflow:visible}
html[dir="rtl"] .arcwrap svg{transform:scaleX(-1)}
.ghost{fill:none;stroke:var(--cream);stroke-width:1;opacity:.13}
.deck{fill:none;stroke:var(--bronze);stroke-width:1.5;stroke-linecap:round}
.arch{fill:none;stroke:var(--cream);stroke-width:1;opacity:.13}
.pier{stroke:var(--cream);stroke-width:1;opacity:.17}
.water{stroke:var(--cream);stroke-width:1;opacity:.07}
.nd{fill:var(--bronze)}.nd.off{fill:none;stroke:var(--cream);stroke-width:1;opacity:.3}.nd.now{fill:none;stroke:var(--bronze);stroke-width:2}
.plab{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.14em;fill:var(--cream);opacity:.38;text-transform:uppercase}
.plab.on{opacity:1;fill:var(--bronze)}
html[dir="rtl"] .plab{transform:scaleX(-1);transform-box:fill-box;transform-origin:center}
.veh{fill:var(--bronze)}.halo{fill:var(--bronze);opacity:.15}

.strap{font-family:var(--mono);font-size:9.5px;letter-spacing:var(--tr);text-transform:uppercase;opacity:.38;margin-top:-4px}
.shores{display:flex;justify-content:space-between;margin-top:-10px;gap:30px}
.shore{width:320px}.shore.r{text-align:end}
.shore .k{font-family:var(--mono);font-size:9px;letter-spacing:var(--tr);text-transform:uppercase;opacity:.4}
.shore .n{font-family:var(--serif);font-size:20px;margin-top:6px;line-height:1.2}
.shore .m{font-size:11.5px;opacity:.45;margin-top:5px;font-weight:300}
@media(max-width:899px){.shores{display:none}}

/* three columns */
.cols{padding-top:52px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:0}
.col{padding:0 32px;border-inline-start:1px solid var(--rule)}
.col:first-child{padding-inline-start:0;border-inline-start:0}
.col:last-child{padding-inline-end:0}
@media(max-width:899px){.cols{grid-template-columns:1fr;padding-top:34px}.col{padding:0;border:0;margin-bottom:34px}}

/* rows */
.rw{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 0;border-bottom:1px solid rgba(242,239,232,.08)}
.rw .l{font-size:13px;font-weight:300;opacity:.82}
.rw .l small{display:block;font-size:11px;opacity:.5;margin-top:4px}
.rw .v{font-family:var(--mono);font-size:9px;letter-spacing:var(--tr);text-transform:uppercase;white-space:nowrap}
.ok{color:var(--checked)}.no{color:var(--unproved)}.wt{color:var(--waiting)}

.item{display:block;width:100%;text-align:start;background:transparent;border:0;color:inherit;cursor:pointer;
  padding:15px 0 17px;border-top:1px solid var(--rule);transition:padding-inline-start 400ms var(--ease)}
.item:hover{padding-inline-start:12px}
.item .r{font-family:var(--mono);font-size:9px;letter-spacing:var(--tr);opacity:.4;display:flex;justify-content:space-between;gap:14px}
.item .n{font-family:var(--serif);font-size:20px;margin-top:7px;line-height:1.2}
.item .f{font-size:12px;opacity:.5;margin-top:6px;font-weight:300}
.mini{height:30px;margin-top:10px}.mini svg{width:100%;height:100%;overflow:visible}
html[dir="rtl"] .mini svg{transform:scaleX(-1)}
.st{display:flex;justify-content:space-between;margin-top:8px}
.st .a{font-family:var(--mono);font-size:8.5px;letter-spacing:var(--tr);text-transform:uppercase;color:var(--bronze)}
.st .b{font-family:var(--mono);font-size:8.5px;letter-spacing:var(--tr);text-transform:uppercase;opacity:.36}

/* cream panels */
.cream{background:var(--cream);color:var(--ink);margin-top:52px}
.cream .inner{max-width:1560px;margin:0 auto;padding:38px var(--pad) 40px}
.cream .sechead{color:var(--bronze-deep)}.cream .sechead span:last-child{color:var(--ink);opacity:.35}
.cream h2{color:var(--ink)}.cream h2 em{color:var(--bronze-deep)}
.cream .rw{border-bottom-color:rgba(0,0,0,.1)}
.cream .rw .l{opacity:.75}
.cream .rw .v{font-family:var(--serif);font-size:17px;letter-spacing:0;text-transform:none}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 44px}
@media(max-width:899px){.g3{grid-template-columns:1fr;gap:0}}

/* actions */
.primary{display:block;width:100%;max-width:520px;text-align:start;background:transparent;border:0;border-top:1px solid var(--cream);
  padding:20px 0 0;font-family:var(--mono);font-size:11.5px;letter-spacing:var(--tr);text-transform:uppercase;color:var(--cream);cursor:pointer;position:relative;margin-top:30px}
.primary::after{content:"";position:absolute;inset-inline-start:0;top:0;height:1px;width:0;background:var(--bronze);transition:width 620ms var(--ease)}
.primary:hover::after{width:100%}
.primary .s{display:block;font-family:var(--sans);font-size:12px;letter-spacing:0;text-transform:none;opacity:.45;margin-top:8px;font-weight:300}
.cream .primary{border-top-color:var(--ink);color:var(--ink)}
.cream .primary::after{background:var(--bronze-deep)}

/* zones (publish) */
.zone{width:100%;display:block;text-align:start;background:transparent;border:0;color:inherit;cursor:pointer;padding:19px 0;border-bottom:1px solid var(--rule);position:relative;
  transition:padding-inline-start 420ms var(--ease),opacity 340ms var(--ease),transform 420ms var(--ease)}
.zone::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:2px;background:var(--bronze);transform:scaleY(0);transform-origin:top;transition:transform 320ms var(--ease)}
.zone:hover{padding-inline-start:22px}.zone:hover::before{transform:scaleY(1)}
.zone.go{padding-inline-start:22px}.zone.go::before{transform:scaleY(1)}
.zone.out{opacity:0;transform:translateX(24px)}
html[dir="rtl"] .zone.out{transform:translateX(-24px)}
.zone .n{font-family:var(--mono);font-size:9px;letter-spacing:var(--tr);opacity:.4;display:block;margin-bottom:6px}
.zone .t{font-family:var(--serif);font-size:27px;line-height:1.14;letter-spacing:var(--th);display:block}
.zone .d{font-size:13px;font-weight:300;opacity:.5;margin-top:7px;display:block;max-width:46ch;line-height:1.5}
@media(max-width:899px){.zone .t{font-size:24px}}

footer{padding:44px var(--pad) 80px;opacity:.3;font-size:11px;line-height:1.6;font-weight:300;max-width:1560px;margin:0 auto}
.rise{opacity:0;transform:translateY(15px)}
.rise.on{opacity:1;transform:none;transition:opacity 600ms var(--ease),transform 600ms var(--ease)}

.sw{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:90;display:flex;background:#131311;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.sw button{background:transparent;border:0;color:rgba(242,239,232,.5);font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;padding:10px 12px;cursor:pointer}
.sw button.on{background:var(--bronze);color:#0E0F0C}
@media (prefers-reduced-motion:reduce){.trun{animation:none}.veh,.halo{display:none}*{transition-duration:1ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4"/></filter></svg>

<header>
  <div class="mx hbar">
    <span class="mark" data-go="landing">Ponte</span>
    <nav class="hnav" id="nav"></nav>
    <span class="who" id="who">GF · 1402 Celsius</span>
  </div>
</header>
<div class="tape"><div class="tmask"></div><div class="trun" id="trun"></div></div>

<main id="app"></main>
<footer id="ft"></footer>

<div class="sw" id="sw"></div>

<script>
/* ============ arc maths: a true circular arc ============ */
function A(x0,x1,yB,rise){const c=x1-x0,R=(c*c/4+rise*rise)/(2*rise);return{d:`M ${x0} ${yB} A ${R} ${R} 0 0 1 ${x1} ${yB}`,R,cx:(x0+x1)/2,cy:yB+(R-rise)}}
function yA(a,x0,x1,t){const x=x0+(x1-x0)*t;return a.cy-Math.sqrt(Math.max(a.R*a.R-(x-a.cx)*(x-a.cx),0))}

function bigArc(el,labels,at,traffic){
  const W=el.clientWidth||1200,H=el.clientHeight||196,x0=8,x1=W-8,yB=H-22,rise=H-70;
  const a=A(x0,x1,yB,rise), N=labels.length-1, wy=H-6;
  const BAYS=Math.max(3,Math.round(W/210));let ar="",pi="";
  for(let b=0;b<BAYS;b++){
    const ax=x0+(x1-x0)*(b/BAYS),zx=x0+(x1-x0)*((b+1)/BAYS);
    const ya=yA(a,x0,x1,b/BAYS),yz=yA(a,x0,x1,(b+1)/BAYS),sp=Math.max(ya,yz)+16,r=(zx-ax)/2;
    ar+=`<path class="arch" d="M ${ax+2} ${wy} L ${ax+2} ${sp} A ${r-2} ${r-2} 0 0 1 ${zx-2} ${sp} L ${zx-2} ${wy}"/>`;
    if(b>0)pi+=`<line class="pier" x1="${ax}" y1="${wy}" x2="${ax}" y2="${ya}"/>`;
  }
  pi+=`<line class="pier" x1="${x0}" y1="${wy}" x2="${x0}" y2="${yB}"/><line class="pier" x1="${x1}" y1="${wy}" x2="${x1}" y2="${yB}"/>`;
  const nodes=labels.map((s,n)=>{const t=n/N,x=x0+(x1-x0)*t,y=yA(a,x0,x1,t);
    const cls=n<at?"nd":(n===at?"nd now":"nd off"),r=n===at?5.6:(n<at?3.4:2.9);
    const an=n===0?"start":(n===N?"end":"middle");
    return `<circle class="${cls}" cx="${x}" cy="${y}" r="${r}"/>`+(s?`<text class="plab ${n===at?'on':''}" x="${x}" y="${y-15}" text-anchor="${an}">${s}</text>`:"")}).join("");
  const tf=traffic?[{d:18,b:0},{d:25,b:-9}].map(t=>`<g>
    <circle class="halo" r="7"><animateMotion dur="${t.d}s" repeatCount="indefinite" begin="${t.b}s"><mpath href="#dk"/></animateMotion>
    <animate attributeName="opacity" values="0;.15;.15;0" keyTimes="0;.12;.88;1" dur="${t.d}s" repeatCount="indefinite" begin="${t.b}s"/></circle>
    <circle class="veh" r="2.5"><animateMotion dur="${t.d}s" repeatCount="indefinite" begin="${t.b}s"><mpath href="#dk"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="${t.d}s" repeatCount="indefinite" begin="${t.b}s"/></circle></g>`).join(""):"";
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line class="water" x1="0" y1="${wy}" x2="${W}" y2="${wy}"/>${ar}${pi}
    <path class="ghost" d="${a.d}"/><path id="dk" class="deck" d="${a.d}"/>${nodes}${tf}</svg>`;
  const p=el.querySelector("#dk"),L=p.getTotalLength();
  p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
  p.style.transition="stroke-dashoffset 1600ms var(--ease)";
  requestAnimationFrame(()=>setTimeout(()=>p.style.strokeDashoffset=L-(L*(at/N)),200));
}
function miniArc(el,total,at){
  const W=el.clientWidth||260,H=30,x0=4,x1=W-4,yB=H-6,rise=H-14,a=A(x0,x1,yB,rise);
  const nodes=[...Array(total+1)].map((_,n)=>{const t=n/total,x=x0+(x1-x0)*t,y=yA(a,x0,x1,t);
    return `<circle class="${n<=at?'nd':'nd off'}" cx="${x}" cy="${y}" r="${n<=at?2.7:2.3}"/>`}).join("");
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path class="ghost" d="${a.d}"/><path class="deck m" d="${a.d}"/>${nodes}</svg>`;
  const p=el.querySelector(".m"),L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L-(L*(at/total));
}

const PROC=["Admitted","Terms","Evidence","Inspection","Payment","Closed"];

function render(){
  chrome();
  app.innerHTML=VIEWS[V]?VIEWS[V]():V_landing();
  ft.textContent="Ponte Trade is operated by 1402 Celsius Ltd. Checks shown are the checks performed, and are never a guarantee about a counterparty.";
  app.querySelectorAll("[data-arc]").forEach(el=>{
    const proc=el.dataset.proc, labels=proc?PROC:(el.dataset.labels?Array(+el.dataset.labels+1).fill(""):["","","",""]);
    bigArc(el,labels,el.dataset.at?+el.dataset.at:(proc?2:labels.length-1),el.dataset.traffic==="1");
  });
  app.querySelectorAll("[data-mini]").forEach(m=>miniArc(m,5,+m.dataset.mini));
  app.querySelectorAll(".zone").forEach(z=>z.onclick=()=>{
    z.classList.add("go");[...z.parentNode.children].forEach(c=>{if(c!==z)c.classList.add("out")});
    ans.push(z.dataset.pick); setTimeout(()=>{if(ans.length>=4){ans=[];V="home"}render()},480);
  });
  app.querySelectorAll(".rise").forEach((n,i)=>setTimeout(()=>n.classList.add("on"),70+i*100));
}
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){V=g.dataset.go;if(V==="publish")ans=[];render();scrollTo({top:0,behavior:"smooth"})}});
document.getElementById("sw").innerHTML=LANGS.map(([k,n])=>`<button data-l="${k}" class="${k==="en"?"on":""}">${n}</button>`).join("");
document.getElementById("sw").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#sw button").forEach(x=>x.classList.remove("on"));b.classList.add("on");L=b.dataset.l;render()};
addEventListener("resize",()=>{app.querySelectorAll("[data-arc]").forEach(el=>{
  const proc=el.dataset.proc,labels=proc?PROC:(el.dataset.labels?Array(+el.dataset.labels+1).fill(""):["","","",""]);
  bigArc(el,labels,el.dataset.at?+el.dataset.at:(proc?2:labels.length-1),el.dataset.traffic==="1")});
  app.querySelectorAll("[data-mini]").forEach(m=>miniArc(m,5,+m.dataset.mini))});
render();
</script>
