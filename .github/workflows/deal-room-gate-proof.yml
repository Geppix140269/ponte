name: Deal Room admission gate proof

# One-use, manually dispatched execution proof for
# `supabase/migrations/20260731g_deal_room_admission_verification_gate.sql`.
#
# This workflow must be dispatched from `main`. The commit under test arrives as
# `target_sha`, so the reviewed workflow definition on `main` is the only code
# that ever receives the production schema-source credential.
#
# The source database operation is deliberately narrow: `pg_dump` is run with
# `--schema-only --schema=public`, and the resulting dump is rejected if it
# contains data markers before anything is restored into the ephemeral stack.

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Full 40-character commit SHA to test (the controller-approved PR #198 head)'
        required: true
        default: ''
      confirm:
        description: 'Type PROVE to confirm this runs the admission-gate proof once'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      LOCAL_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      STACK_DIR: /tmp/ephemeral-supabase
      SCHEMA_FILE: /tmp/production-public-schema.sql
      # Production is PostgreSQL 17.6 and ubuntu-24.04 ships the 16 client, which
      # refuses to dump a newer server. Named once, installed and proved in one
      # step, and called by full path so the major is never left to PATH.
      PG_DUMP_17: /usr/lib/postgresql/17/bin/pg_dump
      MIGRATION_PATH: supabase/migrations/20260731g_deal_room_admission_verification_gate.sql
      MIGRATION_SHA256: 68ce6a8d32bc7a3c88e57b964a2a42ef8f95c8b45e59a05cd47cf110c08acb0b

    steps:
      - name: Confirm the dispatch was deliberate
        run: |
          if [ "${{ inputs.confirm }}" != "PROVE" ]; then
            echo "::error::Type PROVE in the confirm input to run this. Nothing has been done."
            exit 1
          fi

      - name: Refuse to run from anywhere but main
        run: |
          echo "dispatched ref: $GITHUB_REF"
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::This workflow may only be dispatched from main. Set 'Use workflow from' to main."
            echo "::error::The commit under test goes in the target_sha input, not in the branch selector."
            exit 1
          fi

      - name: Validate target_sha
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          if ! printf '%s' "$TARGET_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::target_sha must be exactly 40 lowercase hexadecimal characters."
            echo "::error::Received a value of length ${#TARGET_SHA}. Branch names and short SHAs are rejected."
            exit 1
          fi
          echo "target_sha accepted: $TARGET_SHA"

      - name: Check out the commit under test, and only that commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: The checkout is exactly the requested commit
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "git rev-parse HEAD = $HEAD_SHA"
          echo "target_sha         = $TARGET_SHA"
          if [ "$HEAD_SHA" != "$TARGET_SHA" ]; then
            echo "::error::The checked-out commit is not the requested one. Refusing."
            exit 1
          fi
          echo "the tree under test is the approved commit"

      - name: The commit under test carries the reviewed migration, byte for byte
        run: |
          if [ ! -f "$MIGRATION_PATH" ]; then
            echo "::error::$MIGRATION_PATH is not present in the commit under test."
            exit 1
          fi
          ACTUAL="$(sha256sum "$MIGRATION_PATH" | cut -d' ' -f1)"
          echo "expected SHA-256: $MIGRATION_SHA256"
          echo "actual   SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "$MIGRATION_SHA256" ]; then
            echo "::error::The migration does not match the reviewed checksum. Refusing."
            exit 1
          fi
          echo "migration matches the reviewed checksum"

      - name: The commit under test supplies no workflow definition of its own
        run: |
          if [ -e .github/workflows/deal-room-gate-proof.yml ]; then
            echo "::error::The commit under test contains its own copy of this workflow."
            echo "::error::Remove it from that branch: the definition must come from main alone."
            exit 1
          fi
          echo "no competing workflow definition in the tree under test"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch the running workflow definition from main, to check itself
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: .workflow-definition
          sparse-checkout: .github/workflows
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: The source secret reaches exactly one step, and is never printed
        run: |
          WF=.workflow-definition/.github/workflows/deal-room-gate-proof.yml
          if [ ! -f "$WF" ]; then
            echo "::error::main's copy of this workflow was not fetched. Cannot self-check."
            exit 1
          fi

          uses=$(grep -cE 'secrets\.PONTE_SCHEMA_SOURCE_DATABASE_URL' "$WF" || true)
          echo "steps reading the source secret: $uses"
          if [ "$uses" -ne 1 ]; then
            echo "::error::Expected exactly 1 step to read the source connection string. Found $uses."
            echo "::error::Its only permitted use is the schema-only pg_dump."
            exit 1
          fi

          if grep -nE '(echo|printf|cat|env|set -x)[^|&;]*(\$\{?SOURCE_DB_URL|secrets\.PONTE_SCHEMA_SOURCE)' "$WF" \
               | grep -v 'add-mask'; then
            echo "::error::The source connection string must never be printed."
            exit 1
          fi

          # pg_dump with --schema-only is the one permitted source operation.
          # The source URL must not reach psql, Supabase migration commands, or
          # any other writer-shaped command.
          if grep -nE 'SOURCE_DB_URL[^|&;]*(psql|supabase db|db push|db reset|db execute|migration up)' "$WF"; then
            echo "::error::The source connection string may only be used by schema-only pg_dump."
            exit 1
          fi

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.111.0

      - name: Start an ephemeral local Supabase stack, outside the checkout
        run: |
          mkdir -p "$STACK_DIR"
          cd "$STACK_DIR"
          supabase init --force
          supabase start -x realtime,storage-api,imgproxy,studio,inbucket,edge-runtime,logflare,vector,supavisor
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -c "select current_database(), version();"

      - name: Install the PostgreSQL 17 client
        run: |
          # Run 30688103557 failed here:
          #
          #   pg_dump: error: aborting because of server version mismatch
          #   detail: server version: 17.6; pg_dump version: 16.14
          #
          # `pg_dump` refuses to dump from a server newer than itself, and it is
          # right to: it cannot know what a later major added. ubuntu-24.04
          # ships the 16 client, production is 17.6, so the client has to come
          # from the PostgreSQL apt repository.
          #
          # This installs alongside rather than replacing: the versioned binary
          # is called by full path below, so nothing depends on which `pg_dump`
          # happens to win on PATH.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          # Proved, not assumed: the next step depends on this exact binary.
          if [ ! -x "$PG_DUMP_17" ]; then
            echo "::error::$PG_DUMP_17 was not installed. Cannot dump a 17.6 server."
            exit 1
          fi
          "$PG_DUMP_17" --version

      - name: Dump the production PUBLIC schema only
        env:
          SOURCE_DB_URL: ${{ secrets.PONTE_SCHEMA_SOURCE_DATABASE_URL }}
        run: |
          if [ -z "$SOURCE_DB_URL" ]; then
            echo "::error::The PONTE_SCHEMA_SOURCE_DATABASE_URL secret is not set on this repository."
            exit 1
          fi
          echo "::add-mask::$SOURCE_DB_URL"

          # THE ONLY OPERATION THIS JOB PERFORMS AGAINST THE SOURCE DATABASE.
          # Use pg_dump directly because the previous `supabase db dump --schema
          # public` invocation emitted data markers in run 30687095503. This is
          # explicitly schema-only and public-only.
          #
          # `--no-owner` yes, `--no-acl` NO. The grants ARE the thing under test:
          # proof 2b reads `pg_proc.proacl` and requires an explicit
          # `authenticated=X` on `deal_room_propose` and
          # `deal_room_admit_participant`. Those grants come from historical
          # migrations - 20260731g only `create or replace`s the two functions,
          # which preserves an existing ACL and cannot invent one - so a dump
          # that omits GRANTs would restore them with a null ACL and fail 2b for
          # a reason belonging to the dump rather than to the boundary. The
          # restore step re-establishes schema-level grants itself, so ownership
          # noise is the only thing worth suppressing here.
          #
          # Called by full versioned path: production is 17.6 and the runner's
          # default pg_dump is 16, which refuses outright. The path makes the
          # major explicit rather than leaving it to whatever PATH resolves to.
          "$PG_DUMP_17" \
            --dbname="$SOURCE_DB_URL" \
            --schema=public \
            --schema-only \
            --no-owner \
            --file="$SCHEMA_FILE"

          echo "dump written: $(wc -c < "$SCHEMA_FILE") bytes, $(wc -l < "$SCHEMA_FILE") lines"

      - name: Prove the dump carries no data
        run: |
          fail=0
          # `if grep ... | head -5` tested head's exit status, not grep's, and
          # head always succeeds - so this fired on every dump regardless of
          # content. That is what failed run 30687095503, and the conclusion
          # drawn from it (that `supabase db dump` had emitted data) was wrong:
          # the run printed no matching lines because there were none.
          #
          # `\.` is anchored now too. Unanchored it also matches the \restrict
          # and \unrestrict meta-commands pg_dump 17.6+ wraps every dump in.
          for pattern in '^COPY ' '^INSERT INTO' '^\\\.$' '^-- Data for Name:'; do
            if grep -qE "$pattern" "$SCHEMA_FILE"; then
              grep -nE "$pattern" "$SCHEMA_FILE" | head -5
              echo "::error::The dump contains data ($pattern). Refusing to continue."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            rm -f "$SCHEMA_FILE"
            exit 1
          fi
          if ! grep -q 'CREATE TABLE' "$SCHEMA_FILE"; then
            echo "::error::The dump contains no CREATE TABLE. The source schema did not arrive."
            exit 1
          fi
          echo "no COPY, no INSERT, no data section; $(grep -c 'CREATE TABLE' "$SCHEMA_FILE") tables"

      - name: Restore that schema into the ephemeral database
        run: |
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          drop schema if exists public cascade;
          create schema public;
          alter schema public owner to postgres;
          grant usage on schema public to anon, authenticated, service_role;
          grant all on schema public to postgres, service_role;
          SQL
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f "$SCHEMA_FILE"
          rm -f "$SCHEMA_FILE"

      - name: The restored database carries schema and no business rows
        run: |
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -t -A -F' ' <<'SQL'
          select 'profiles', count(*) from public.profiles
          union all select 'listings', count(*) from public.listings
          union all select 'deal_rooms', count(*) from public.deal_rooms
          union all select 'deal_room_participants', count(*) from public.deal_room_participants
          union all select 'auth.users', count(*) from auth.users;
          SQL
          empty=$(psql "$LOCAL_DB_URL" -t -A -c "select (select count(*) from public.profiles) + (select count(*) from public.listings) + (select count(*) from auth.users);")
          if [ "$empty" != "0" ]; then
            echo "::error::The ephemeral database is not empty ($empty rows across profiles, listings and auth.users)."
            echo "::error::Production data must never reach this runner. Stopping."
            exit 1
          fi
          echo "profiles, listings and auth.users are all empty, as required"

      - name: Run the admission gate proof, exactly once
        env:
          DATABASE_URL: ${{ env.LOCAL_DB_URL }}
          DEAL_ROOM_PROOF_ALLOW: '1'
        run: |
          case "$DATABASE_URL" in
            *127.0.0.1*|*localhost*) ;;
            *) echo "::error::The proof may only run against the local stack. Refusing."; exit 1 ;;
          esac
          npm run deal-room:gate-proof

      - name: Destroy the ephemeral stack
        if: always()
        run: |
          cd "$STACK_DIR" 2>/dev/null && supabase stop --no-backup || true
          rm -rf "$STACK_DIR" "$SCHEMA_FILE" || true
          echo "ephemeral stack stopped and removed"
