<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ponte, signed in</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#0E0F0C;--cream:#F2EFE6;--bronze:#C79A4C;--bronze-deep:#8A6520;
  --attention:#C79A4C;--blocked:#C4664E;--done:#5E9B78;
  --serif:"Playfair Display",Georgia,serif;--sans:"Inter",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.19,1,.22,1);
}
html,body{height:100%}
body{background:#050504;display:flex;align-items:flex-start;justify-content:center;gap:34px;flex-wrap:wrap;padding:26px;font-family:var(--sans)}
.wrap{position:relative}
.cap{position:absolute;bottom:-24px;left:0;font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;color:rgba(255,255,255,.3);text-transform:uppercase}
.phone{width:390px;height:844px;position:relative;overflow-y:auto;overflow-x:hidden;background:var(--ink);color:var(--cream);box-shadow:0 0 0 1px rgba(255,255,255,.06);scrollbar-width:none}
.phone::-webkit-scrollbar{display:none}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.15;mix-blend-mode:overlay;z-index:20}

nav{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:20px 24px;background:linear-gradient(to bottom,var(--ink) 64%,transparent)}
.mark{font-family:var(--mono);font-size:10.5px;letter-spacing:.44em;text-transform:uppercase}
.who{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.45}

.greet{padding:22px 24px 0}
.greet .eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--bronze)}
.greet h1{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.03;letter-spacing:-.022em;margin-top:14px}
.greet h1 em{font-style:italic;color:var(--bronze)}

/* ---------- waiting on you ---------- */
.waiting{margin:30px 0 0;border-top:1px solid rgba(255,255,255,.12)}
.w{display:block;width:100%;text-align:left;background:transparent;border:0;color:inherit;cursor:pointer;
  padding:17px 24px;border-bottom:1px solid rgba(255,255,255,.08);position:relative;transition:padding-left 420ms var(--ease)}
.w::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--attention);transform:scaleY(0);transform-origin:top;transition:transform 340ms var(--ease)}
.w:hover{padding-left:34px}
.w:hover::before{transform:scaleY(1)}
.w .k{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--attention)}
.w .t{font-family:var(--serif);font-size:21px;line-height:1.22;margin-top:8px}
.w .d{font-size:12px;opacity:.5;margin-top:6px;font-weight:300}

/* ---------- crossings ---------- */
section{padding:44px 24px 0}
.sechead{font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--bronze);margin-bottom:18px;display:flex;justify-content:space-between}
.sechead span:last-child{opacity:.4;color:var(--cream)}

.x{display:block;width:100%;text-align:left;background:transparent;border:0;color:inherit;cursor:pointer;
  padding:18px 0 20px;border-top:1px solid rgba(255,255,255,.1);position:relative;transition:padding-left 420ms var(--ease)}
.x:hover{padding-left:12px}
.x .ref{font-family:var(--mono);font-size:9px;letter-spacing:.2em;opacity:.4;display:flex;justify-content:space-between}
.x .nm{font-family:var(--serif);font-size:22px;line-height:1.18;margin-top:8px}

.mini{margin-top:16px;height:34px;position:relative}
.mini svg{width:100%;height:100%;overflow:visible}
.md{fill:none;stroke:var(--bronze);stroke-width:1.2;stroke-linecap:round}
.mg{fill:none;stroke:var(--cream);stroke-width:1;opacity:.13;stroke-dasharray:2 4}
.mn{fill:var(--bronze)}
.mn.off{fill:none;stroke:var(--cream);stroke-width:1;opacity:.25}

.stage{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px}
.stage .s{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze)}
.stage .r{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.4}
.stage .r.warn{color:var(--attention);opacity:1}

/* ---------- read for you ---------- */
.sig{display:block;width:100%;text-align:left;background:transparent;border:0;color:inherit;cursor:pointer;
  padding:15px 0;border-top:1px solid rgba(255,255,255,.1);transition:padding-left 420ms var(--ease)}
.sig:hover{padding-left:12px}
.sig .m{font-family:var(--mono);font-size:9px;letter-spacing:.18em;opacity:.4;display:flex;gap:12px}
.sig .n{font-family:var(--serif);font-size:19px;margin-top:6px;line-height:1.2}
.sig .f{font-size:11.5px;opacity:.48;margin-top:5px;font-weight:300}

/* ---------- start ---------- */
.start{margin:44px 0 0;background:var(--cream);color:var(--ink);padding:34px 24px 38px}
.start .eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--bronze-deep)}
.start h2{font-family:var(--serif);font-size:30px;line-height:1.06;letter-spacing:-.018em;font-weight:400;margin-top:14px}
.start h2 em{font-style:italic;color:var(--bronze-deep)}
.cta{width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--ink);color:var(--ink);
  font-family:var(--mono);font-size:11px;letter-spacing:.26em;text-transform:uppercase;padding:18px 0 0;margin-top:24px;cursor:pointer;position:relative}
.cta::after{content:"";position:absolute;left:0;top:0;height:1px;width:0;background:var(--bronze-deep);transition:width 620ms var(--ease)}
.cta:hover::after{width:100%}
footer{padding:34px 24px 60px;opacity:.3;font-size:11px;line-height:1.6;font-weight:300}

.rise{opacity:0;transform:translateY(16px)}
.rise.on{opacity:1;transform:none;transition:opacity 620ms var(--ease),transform 620ms var(--ease)}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4"/></filter></svg>
<div class="wrap"><div class="phone" id="p"></div><div class="cap">signed in &middot; your crossings</div></div>

<script>
const STAGES=["Published","Interest","Room prepared","Active","Closed"];
const CROSSINGS=[
 {ref:"PT-0105",age:"Published 21 Jul",nm:"Gas oil EN 590, 30,000 MT",at:3,stage:"Room prepared",right:"Activate to continue",warn:true},
 {ref:"PT-0098",age:"Published 12 Jul",nm:"Freight forwarding, Adriatic to Levant",at:2,stage:"Two interests",right:"Expires in 3 days",warn:true},
 {ref:"PT-0087",age:"Published 2 Jul",nm:"Olive oil, private label, 18,000 L",at:1,stage:"Live on the board",right:"41 days left",warn:false}
];
const MATCHED=[
 {ref:"EXT-G4WB-000412",read:"Read yesterday",n:"Gas oil, EN 590 10ppm",f:"30,000 MT · Origin Türkiye · CIF"},
 {ref:"EXT-G4WB-000401",read:"Read 4 Aug",n:"Bunker fuel, VLSFO",f:"12,000 MT · Destination Malta"}
];

function span(at){
  const W=342,H=34,y=26,rise=20,N=STAGES.length-1;
  const pt=n=>{const x=4+(W-8)*(n/N);return [x, y-rise*Math.sin(Math.PI*(n/N))];};
  let done="",ghost="";
  for(let n=0;n<=N;n++){const[a,b]=pt(n);(n<=at?done:ghost);}
  const d=(from,to)=>{let s="";for(let n=from;n<=to;n++){const[x,y2]=pt(n);s+=(n===from?`M ${x} ${y2}`:` L ${x} ${y2}`)}return s};
  const nodes=STAGES.map((_,n)=>{const[x,y2]=pt(n);
    return n<=at?`<circle class="mn" cx="${x}" cy="${y2}" r="3"/>`:`<circle class="mn off" cx="${x}" cy="${y2}" r="2.6"/>`}).join("");
  return `<div class="mini"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path class="mg" d="${d(0,N)}"/>
    <path class="md" d="${d(0,at)}"/>
    ${nodes}</svg></div>`;
}

document.getElementById("p").innerHTML=`
<div class="grain" style="filter:url(#g)"></div>
<nav><div class="mark">Ponte</div><div class="who">GF · 1402 Celsius</div></nav>

<div class="greet rise">
  <div class="eyebrow">Thursday, 6 August</div>
  <h1>Two things are<br><em>waiting on you.</em></h1>
</div>

<div class="waiting rise">
  <button class="w">
    <span class="k">Accepted interest</span>
    <span class="t">Kefalonia Marine wants to proceed on PT-0105</span>
    <span class="d">Their identity is disclosed. Prepare the Deal Room, free, and activate when you are ready.</span>
  </button>
  <button class="w">
    <span class="k">Expiring</span>
    <span class="t">PT-0098 comes off the board in 3 days</span>
    <span class="d">Two members have expressed interest since Tuesday. Extend, or let it close.</span>
  </button>
</div>

<section class="rise">
  <div class="sechead"><span>Your crossings</span><span>03</span></div>
  ${CROSSINGS.map(c=>`<button class="x">
    <span class="ref"><span>${c.ref}</span><span>${c.age}</span></span>
    <span class="nm">${c.nm}</span>
    ${span(c.at)}
    <span class="stage"><span class="s">${c.stage}</span><span class="r ${c.warn?'warn':''}">${c.right}</span></span>
  </button>`).join("")}
</section>

<section class="rise">
  <div class="sechead"><span>Read for you</span><span>02</span></div>
  ${MATCHED.map(m=>`<button class="sig">
    <span class="m"><span>${m.ref}</span><span>${m.read}</span></span>
    <span class="n">${m.n}</span>
    <span class="f">${m.f}</span>
  </button>`).join("")}
  <p style="font-size:11px;opacity:.4;margin-top:18px;line-height:1.6;font-weight:300">
    Matched to your published opportunities. Nothing here has been confirmed with the party named in it.
  </p>
</section>

<div class="start rise">
  <div class="eyebrow">Something new</div>
  <h2>Start another <em>crossing.</em></h2>
  <button class="cta">Publish an opportunity</button>
</div>

<footer>Your first Deal Room activation and every one after costs $79 USD for 30 calendar days. Everything before it is free.</footer>
`;

document.querySelectorAll(".rise").forEach((n,i)=>setTimeout(()=>n.classList.add("on"),80+i*110));
</script>
</body>
</html>
