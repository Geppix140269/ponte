<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ponte, landing concept</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#0E0F0C; --cream:#F2EFE6; --bronze:#C79A4C; --bronze-deep:#8A6520;
  --serif:"Playfair Display",Georgia,serif; --sans:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.19,1,.22,1);
}
html,body{height:100%}
body{background:#050504;display:flex;align-items:flex-start;justify-content:center;gap:34px;flex-wrap:wrap;padding:26px;font-family:var(--sans)}
.wrap{position:relative}
.cap{position:absolute;bottom:-24px;left:0;font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;color:rgba(255,255,255,.3);text-transform:uppercase}

.phone{width:390px;height:844px;position:relative;overflow-y:auto;overflow-x:hidden;background:var(--ink);color:var(--cream);box-shadow:0 0 0 1px rgba(255,255,255,.06);scrollbar-width:none}
.phone::-webkit-scrollbar{display:none}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.15;mix-blend-mode:overlay;z-index:20}

/* ---------- nav ---------- */
nav{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:20px 24px;background:linear-gradient(to bottom,var(--ink) 62%,transparent)}
.mark{font-family:var(--mono);font-size:10.5px;letter-spacing:.44em;text-transform:uppercase}
.enter{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--bronze);border:0;background:transparent;cursor:pointer;padding:0}

/* ---------- hero ---------- */
.hero{position:relative;padding:34px 24px 0;min-height:520px}
.bridge{position:absolute;left:0;right:0;top:88px;height:300px;pointer-events:none}
.bridge svg{width:100%;height:100%;overflow:visible}
.deck{fill:none;stroke:var(--bronze);stroke-width:1.3;stroke-linecap:round}
.cbl{stroke:var(--cream);stroke-width:.7;opacity:.12}
.pr{stroke:var(--cream);stroke-width:1;opacity:.2}
.nd{fill:var(--bronze)}

.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--bronze)}
h1{font-family:var(--serif);font-weight:400;font-size:52px;line-height:.96;letter-spacing:-.026em;margin-top:20px;position:relative;z-index:3}
h1 em{font-style:italic;color:var(--bronze)}
.lede{font-size:15px;line-height:1.55;font-weight:300;opacity:.62;margin-top:198px;max-width:30ch;position:relative;z-index:3}

.act{margin-top:30px;position:relative;z-index:3}
.primary{display:block;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--cream);
  padding:20px 0 0;font-family:var(--mono);font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--cream);cursor:pointer;position:relative}
.primary::after{content:"";position:absolute;left:0;top:0;height:1px;width:0;background:var(--bronze);transition:width 620ms var(--ease)}
.primary:hover::after{width:100%}
.primary .sub{display:block;font-family:var(--sans);font-size:12px;letter-spacing:0;text-transform:none;opacity:.45;margin-top:8px;font-weight:300}

/* ---------- live counters ---------- */
.pulse{margin-top:44px;border-top:1px solid rgba(255,255,255,.1);padding-top:18px;position:relative;z-index:3}
.pulse .row{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.pulse .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.42}
.pulse .v{font-family:var(--serif);font-size:26px;letter-spacing:-.01em}
.pulse .v small{font-size:12px;opacity:.5;font-family:var(--mono);letter-spacing:.1em;margin-left:6px}

/* ---------- signals ---------- */
section{padding:60px 24px}
.sechead{font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--bronze);margin-bottom:22px}
h2{font-family:var(--serif);font-size:34px;line-height:1.06;letter-spacing:-.018em;font-weight:400;margin-bottom:26px}
h2 em{font-style:italic;color:var(--bronze)}

.sig{display:block;width:100%;text-align:left;background:transparent;border:0;color:inherit;cursor:pointer;
  padding:16px 0;border-top:1px solid rgba(255,255,255,.1);position:relative;transition:padding-left 420ms var(--ease)}
.sig:hover{padding-left:14px}
.sig .meta{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.4;display:flex;gap:12px}
.sig .name{font-family:var(--serif);font-size:21px;line-height:1.2;margin-top:7px}
.sig .facts{font-size:12px;opacity:.5;margin-top:6px;font-weight:300}
.sig .unc{color:var(--bronze);opacity:.85}

/* ---------- the three ---------- */
.fam{border-top:1px solid rgba(255,255,255,.1);padding:22px 0;display:flex;gap:18px;align-items:baseline}
.fam .n{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--bronze);width:24px;flex:0 0 auto}
.fam .t{font-family:var(--serif);font-size:23px;line-height:1.15}
.fam .d{font-size:12.5px;opacity:.5;margin-top:6px;font-weight:300;line-height:1.5}

/* ---------- price ---------- */
.price{background:var(--cream);color:var(--ink);padding:52px 24px;margin-top:20px}
.price .sechead{color:var(--bronze-deep)}
.price h2{color:var(--ink)}
.price h2 em{color:var(--bronze-deep)}
.price .line{display:flex;justify-content:space-between;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(0,0,0,.1)}
.price .l{font-size:13.5px;font-weight:300;opacity:.7}
.price .r{font-family:var(--serif);font-size:20px}
.price .free{color:var(--bronze-deep)}
.price .note{font-size:11.5px;opacity:.5;margin-top:18px;line-height:1.55;font-weight:300}

footer{padding:46px 24px 60px;opacity:.32;font-size:11px;line-height:1.6;font-weight:300}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4"/></filter></svg>

<div class="wrap"><div class="phone" id="p"></div><div class="cap">landing concept &middot; 390px</div></div>

<script>
const SIGNALS=[
 {ref:"EXT-G4WB-000412",read:"Read 4 Aug",name:"Gas oil, EN 590 10ppm",facts:"27 · 30,000 MT · Origin Türkiye · CIF"},
 {ref:"EXT-G4WB-000398",read:"Read 3 Aug",name:"Refined sunflower oil",facts:"15 · 5,000 MT · Destination Egypt · FOB"},
 {ref:"EXT-G4WB-000377",read:"Read 2 Aug",name:"Freight forwarding, Adriatic",facts:"Trade service · Italy to Levant"}
];

const p=document.getElementById("p");
p.innerHTML=`
<div class="grain" style="filter:url(#g)"></div>

<nav><div class="mark">Ponte</div><button class="enter">Sign in</button></nav>

<div class="hero">
  <div class="eyebrow">Cross-border trade</div>
  <h1>Two sides.<br>One <em>crossing.</em></h1>

  <div class="bridge"><svg viewBox="0 0 390 300" preserveAspectRatio="none">
    <line class="pr" x1="30" y1="252" x2="30" y2="196"/>
    <line class="pr" x1="360" y1="252" x2="360" y2="196"/>
    ${[0,1,2,3,4,5,6,7,8].map(n=>{const x=30+330*(n/8),y=196-116*Math.sin(Math.PI*(n/8));return `<line class="cbl" x1="${x}" y1="${y}" x2="${x}" y2="252"/>`}).join("")}
    <path class="deck" id="dk" d="${(()=>{let d="";for(let n=0;n<=8;n++){const x=30+330*(n/8),y=196-116*Math.sin(Math.PI*(n/8));d+=(n?` L ${x} ${y}`:`M ${x} ${y}`)}return d})()}"/>
    ${[0,4,8].map(n=>{const x=30+330*(n/8),y=196-116*Math.sin(Math.PI*(n/8));return `<circle class="nd" cx="${x}" cy="${y}" r="3.5"/>`}).join("")}
  </svg></div>

  <div class="lede">Ponte reads the market, publishes your opportunity, and gives you a controlled room to close it in. Everything up to that room is free.</div>

  <div class="act">
    <button class="primary">Publish an opportunity
      <span class="sub">Four questions. No account needed to start.</span>
    </button>
  </div>

  <div class="pulse">
    <div class="row"><span class="k">Market signals read</span><span class="v">11,680</span></div>
    <div class="row"><span class="k">Live on the board</span><span class="v">3,458</span></div>
    <div class="row"><span class="k">Restricted parties screened</span><span class="v">32,047</span></div>
  </div>
</div>

<section>
  <div class="sechead">Read this week</div>
  <h2>What the market is <em>asking for.</em></h2>
  ${SIGNALS.map(s=>`<button class="sig">
     <span class="meta"><span>${s.ref}</span><span>${s.read}</span></span>
     <span class="name">${s.name}</span>
     <span class="facts">${s.facts}</span>
   </button>`).join("")}
  <p style="font-size:11.5px;opacity:.42;margin-top:22px;line-height:1.6;font-weight:300">
    Nothing above has been confirmed with the party named in it, and nobody behind one is a Ponte member.
    <span class="unc">Ask Ponte to investigate, $49.</span>
  </p>
</section>

<section style="padding-top:10px">
  <div class="sechead">Three markets</div>
  <h2>Whatever you <em>move.</em></h2>
  <div class="fam"><span class="n">01</span><span><span class="t">Products</span><span class="d">Goods crossing a border, by the shipment or by the programme.</span></span></div>
  <div class="fam"><span class="n">02</span><span><span class="t">Trade services</span><span class="d">Freight, inspection, customs, finance, insurance.</span></span></div>
  <div class="fam"><span class="n">03</span><span><span class="t">Distribution</span><span class="d">Carrying a brand into a market, or finding someone to carry yours.</span></span></div>
</section>

<div class="price">
  <div class="sechead">One price</div>
  <h2>Free until it <em>gets serious.</em></h2>
  <div class="line"><span class="l">Publish an opportunity</span><span class="r free">Free</span></div>
  <div class="line"><span class="l">Search and express interest</span><span class="r free">Free</span></div>
  <div class="line"><span class="l">Prepare a Deal Room</span><span class="r free">Free</span></div>
  <div class="line"><span class="l">Activate it, 30 calendar days</span><span class="r">$79 USD</span></div>
  <p class="note">Five active counterparty branches included. $15 USD for each additional branch, never more than $199 USD per room in a 30-day period. No subscription, no credits, no commission.</p>
</div>

<footer>Ponte Trade is operated by 1402 Celsius Ltd. Checks shown are the checks performed, and are never a guarantee about a counterparty.</footer>
`;

// draw the span on load
const dk=p.querySelector("#dk");
const L=dk.getTotalLength();
dk.style.strokeDasharray=L; dk.style.strokeDashoffset=L;
dk.style.transition="stroke-dashoffset 2200ms var(--ease)";
requestAnimationFrame(()=>{setTimeout(()=>dk.style.strokeDashoffset=0,260)});
</script>
</body>
</html>
