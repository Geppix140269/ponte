<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ponte, the Deal Room</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#0E0F0C;--cream:#F2EFE6;--bronze:#C79A4C;--bronze-deep:#8A6520;
  --checked:#5E9B78;--unproved:#C4664E;--waiting:#C79A4C;
  --serif:"Playfair Display",Georgia,serif;--sans:"Inter",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.19,1,.22,1);
}
html,body{height:100%}
body{background:#050504;display:flex;align-items:flex-start;justify-content:center;gap:34px;flex-wrap:wrap;padding:26px 26px 60px;font-family:var(--sans)}
.wrap{position:relative}
.cap{position:absolute;bottom:-24px;left:0;font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;color:rgba(255,255,255,.32);text-transform:uppercase}
.phone{width:390px;height:844px;position:relative;overflow-y:auto;overflow-x:hidden;background:var(--ink);color:var(--cream);box-shadow:0 0 0 1px rgba(255,255,255,.06);scrollbar-width:none}
.phone::-webkit-scrollbar{display:none}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.15;mix-blend-mode:overlay;z-index:30}

nav{position:sticky;top:0;z-index:12;padding:18px 24px 14px;background:linear-gradient(to bottom,var(--ink) 70%,transparent)}
.navtop{display:flex;justify-content:space-between;align-items:baseline}
.mark{font-family:var(--mono);font-size:10px;letter-spacing:.42em;text-transform:uppercase;opacity:.5}
.ref{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--bronze)}
.state{display:flex;justify-content:space-between;align-items:baseline;margin-top:11px}
.state .s{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.45}
.state .d{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--waiting)}

h1{font-family:var(--serif);font-weight:400;font-size:33px;line-height:1.05;letter-spacing:-.02em;padding:18px 24px 0}
h1 em{font-style:italic;color:var(--bronze)}

/* ---------- the procedure span ---------- */
.proc{padding:26px 24px 0}
.procspan{height:96px;position:relative;margin-top:6px}
.procspan svg{width:100%;height:100%;overflow:visible}
.pd{fill:none;stroke:var(--bronze);stroke-width:1.3;stroke-linecap:round}
.pg{fill:none;stroke:var(--cream);stroke-width:1;opacity:.13;stroke-dasharray:2 5}
.pn{fill:var(--bronze)}
.pn.off{fill:none;stroke:var(--cream);stroke-width:1;opacity:.26}
.pn.now{fill:none;stroke:var(--bronze);stroke-width:1.6}
.plab{font-family:"JetBrains Mono",monospace;font-size:7.5px;letter-spacing:.14em;fill:var(--cream);opacity:.42;text-transform:uppercase}
.plab.on{opacity:.95;fill:var(--bronze)}

.step{border-top:1px solid rgba(255,255,255,.12);margin-top:20px;padding-top:16px}
.step .k{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--bronze)}
.step .t{font-family:var(--serif);font-size:23px;line-height:1.2;margin-top:9px}
.step .d{font-size:12.5px;opacity:.52;margin-top:8px;font-weight:300;line-height:1.5}

/* ---------- sections ---------- */
section{padding:40px 24px 0}
.sechead{font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--bronze);display:flex;justify-content:space-between;margin-bottom:16px}
.sechead span:last-child{color:var(--cream);opacity:.38}

/* ---------- integrity ---------- */
.ig{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.ig .l{font-size:13px;font-weight:300;opacity:.8}
.ig .v{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.v.ok{color:var(--checked)}.v.no{color:var(--unproved)}.v.wt{color:var(--waiting)}
.ignote{font-size:11px;opacity:.4;margin-top:14px;line-height:1.6;font-weight:300}

/* ---------- branches ---------- */
.br{display:block;width:100%;text-align:left;background:transparent;border:0;color:inherit;cursor:pointer;
  padding:16px 0 18px;border-top:1px solid rgba(255,255,255,.1);transition:padding-left 420ms var(--ease)}
.br:hover{padding-left:12px}
.br .r{font-family:var(--mono);font-size:9px;letter-spacing:.2em;opacity:.42;display:flex;justify-content:space-between}
.br .n{font-family:var(--serif);font-size:20px;margin-top:7px;line-height:1.2}
.mini{height:26px;margin-top:12px}
.mini svg{width:100%;height:100%;overflow:visible}
.st{display:flex;justify-content:space-between;margin-top:8px}
.st .a{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze)}
.st .b{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.38}

/* ---------- evidence ---------- */
.ev{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.ev .l{font-size:13px;font-weight:300}
.ev .l small{display:block;font-size:11px;opacity:.42;margin-top:4px}
.ev .s{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}

/* ---------- deal snapshot on cream ---------- */
.snap{background:var(--cream);color:var(--ink);padding:32px 24px 34px;margin-top:44px}
.snap .sechead{color:var(--bronze-deep)}
.snap .sechead span:last-child{color:var(--ink);opacity:.35}
.snap .row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.1)}
.snap .k{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;opacity:.45;white-space:nowrap}
.snap .v{font-family:var(--serif);font-size:17px;text-align:right}
.snap .note{font-size:11px;opacity:.5;margin-top:16px;line-height:1.6;font-weight:300}

/* ---------- activity ---------- */
.ac{padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07);display:flex;gap:14px;align-items:baseline}
.ac .w{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;opacity:.35;white-space:nowrap;width:52px;flex:0 0 auto}
.ac .x{font-size:12.5px;font-weight:300;opacity:.72;line-height:1.45}

footer{padding:34px 24px 70px;opacity:.32;font-size:11px;line-height:1.6;font-weight:300}

/* ---------- view switch ---------- */
.switch{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:40;display:flex;gap:0;background:#111;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.switch button{background:transparent;border:0;color:rgba(242,239,232,.5);font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;padding:11px 16px;cursor:pointer}
.switch button.on{color:#0E0F0C;background:var(--bronze)}

.rise{opacity:0;transform:translateY(15px)}
.rise.on{opacity:1;transform:none;transition:opacity 600ms var(--ease),transform 600ms var(--ease)}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4"/></filter></svg>

<div class="wrap"><div class="phone" id="p"></div><div class="cap" id="capt">the room</div></div>

<div class="switch">
  <button id="bOwner" class="on">You, administrator</button>
  <button id="bParty">A counterparty</button>
</div>

<script>
const PROC=["Admitted","Terms","Evidence","Inspection","Payment terms","Closed"];
const AT=2;

function span(steps,at,h,labels){
  const W=342,y=h-18,rise=h-46;
  const pt=n=>{const x=6+(W-12)*(n/(steps.length-1));return [x,y-rise*Math.sin(Math.PI*(n/(steps.length-1)))]};
  const d=(a,b)=>{let s="";for(let n=a;n<=b;n++){const[x,yy]=pt(n);s+=(n===a?`M ${x} ${yy}`:` L ${x} ${yy}`)}return s};
  const nodes=steps.map((_,n)=>{const[x,yy]=pt(n);
    if(n<at)  return `<circle class="pn" cx="${x}" cy="${yy}" r="3.2"/>`;
    if(n===at)return `<circle class="pn now" cx="${x}" cy="${yy}" r="5"/>`;
    return `<circle class="pn off" cx="${x}" cy="${yy}" r="2.8"/>`}).join("");
  const labs=labels?steps.map((s,n)=>{const[x,yy]=pt(n);
    const anchor=n===0?"start":(n===steps.length-1?"end":"middle");
    return `<text class="plab ${n===at?'on':''}" x="${x}" y="${yy-12}" text-anchor="${anchor}">${s}</text>`}).join(""):"";
  return `<svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none">
    <path class="pg" d="${d(0,steps.length-1)}"/><path class="pd" d="${d(0,at)}"/>${nodes}${labs}</svg>`;
}

const INTEGRITY=`
  <div class="ig"><span class="l">Both organisations exist on a public register</span><span class="v ok">Checked</span></div>
  <div class="ig"><span class="l">Restricted-party screening, both sides</span><span class="v ok">Checked</span></div>
  <div class="ig"><span class="l">Authority to sign, declared by each party</span><span class="v wt">Declared, not proved</span></div>
  <div class="ig"><span class="l">Product specification against the shipment</span><span class="v no">Not yet supplied</span></div>
  <div class="ig"><span class="l">Ability to pay</span><span class="v no">Never checked by Ponte</span></div>
  <p class="ignote">Both parties see this list, identically. A check that Ponte has performed is named. A check Ponte has not performed is named too. Nothing here says a counterparty is safe.</p>`;

const EVIDENCE=`
  <div class="ev"><span class="l">Certificate of analysis<small>Required before inspection</small></span><span class="s" style="color:var(--waiting)">Requested</span></div>
  <div class="ev"><span class="l">Company registration extract<small>Supplied 2 August</small></span><span class="s" style="color:var(--checked)">Accepted for this procedure</span></div>
  <div class="ev"><span class="l">Bill of lading<small>Not yet produced. No shipment exists.</small></span><span class="s" style="opacity:.4">Expected later</span></div>
  <div class="ev"><span class="l">Phytosanitary certificate<small>Not applicable to this product</small></span><span class="s" style="opacity:.28">Not applicable</span></div>`;

const ACTIVITY=`
  <div class="ac"><span class="w">09:14</span><span class="x">Kefalonia Marine accepted the participation agreement.</span></div>
  <div class="ac"><span class="w">Yesterday</span><span class="x">You proposed the procedure. Awaiting agreement.</span></div>
  <div class="ac"><span class="w">4 Aug</span><span class="x">Room activated. 30 calendar days, to 3 September 2026, 14:32 UTC.</span></div>`;

function ownerView(){
  return `
  <div class="grain" style="filter:url(#g)"></div>
  <nav>
    <div class="navtop"><span class="mark">Ponte</span><span class="ref">DR-0042 · PD-0042</span></div>
    <div class="state"><span class="s">Active · procedure not agreed</span><span class="d">28 days left</span></div>
  </nav>

  <h1 class="rise">Gas oil EN 590<br><em>30,000 MT.</em></h1>

  <div class="proc rise">
    <div class="sechead"><span>The procedure</span><span>03 / 06</span></div>
    <div class="procspan">${span(PROC,AT,96,true)}</div>
    <div class="step">
      <div class="k">Waiting on both parties</div>
      <div class="t">Agree what evidence this deal needs, from whom, and by when.</div>
      <div class="d">Ponte does not decide this. You and the counterparty agree it, and the room then holds you both to it.</div>
    </div>
  </div>

  <section class="rise">
    <div class="sechead"><span>Counterparty branches</span><span>03</span></div>
    <button class="br"><span class="r"><span>Branch A</span><span>Admitted 4 Aug</span></span>
      <span class="n">Kefalonia Marine Fuels</span>
      <span class="mini">${span(PROC,2,26,false)}</span>
      <span class="st"><span class="a">Evidence</span><span class="b">Principal · Greece</span></span></button>
    <button class="br"><span class="r"><span>Branch B</span><span>Invited 5 Aug</span></span>
      <span class="n">Adriatic Bunker Supply</span>
      <span class="mini">${span(PROC,0,26,false)}</span>
      <span class="st"><span class="a">Awaiting admission</span><span class="b">Broker · Malta</span></span></button>
    <button class="br"><span class="r"><span>Branch C</span><span>Admitted 5 Aug</span></span>
      <span class="n">Levant Energy Trading</span>
      <span class="mini">${span(PROC,1,26,false)}</span>
      <span class="st"><span class="a">Terms</span><span class="b">Principal · Cyprus</span></span></button>
    <p class="ignote">No counterparty can see this list, or that it has three entries. They see their own branch and nothing else.</p>
  </section>

  <section class="rise">
    <div class="sechead"><span>Ponte Integrity</span><span></span></div>
    ${INTEGRITY}
  </section>

  <section class="rise">
    <div class="sechead"><span>Evidence register</span><span>Branch A</span></div>
    ${EVIDENCE}
  </section>

  <div class="snap rise">
    <div class="sechead"><span>The deal</span><span>From PT-0105</span></div>
    <div class="row"><span class="k">Product</span><span class="v">Gas oil EN 590 10ppm</span></div>
    <div class="row"><span class="k">Quantity</span><span class="v">30,000 MT</span></div>
    <div class="row"><span class="k">Origin</span><span class="v">Türkiye</span></div>
    <div class="row"><span class="k">Delivery</span><span class="v">CIF</span></div>
    <div class="row"><span class="k">HS code</span><span class="v">2710.19</span></div>
    <p class="note">Carried from your published opportunity. Nothing was re-entered.</p>
  </div>

  <section class="rise">
    <div class="sechead"><span>Activity</span><span>Append only</span></div>
    ${ACTIVITY}
  </section>

  <footer>Active until 3 September 2026, 14:32 UTC. When the period ends the room becomes permanently read only. It is never deleted.</footer>`;
}

function partyView(){
  return `
  <div class="grain" style="filter:url(#g)"></div>
  <nav>
    <div class="navtop"><span class="mark">Ponte</span><span class="ref">DR-0042 · Branch A</span></div>
    <div class="state"><span class="s">Active · procedure not agreed</span><span class="d">28 days left</span></div>
  </nav>

  <h1 class="rise">Gas oil EN 590<br><em>30,000 MT.</em></h1>

  <div class="proc rise">
    <div class="sechead"><span>Your procedure</span><span>03 / 06</span></div>
    <div class="procspan">${span(PROC,AT,96,true)}</div>
    <div class="step">
      <div class="k">Waiting on you and 1402 Celsius</div>
      <div class="t">Agree what evidence this deal needs, from whom, and by when.</div>
      <div class="d">You are in your own branch. What you upload here stays here.</div>
    </div>
  </div>

  <section class="rise">
    <div class="sechead"><span>Ponte Integrity</span><span></span></div>
    ${INTEGRITY}
  </section>

  <section class="rise">
    <div class="sechead"><span>Evidence register</span><span>Your branch</span></div>
    ${EVIDENCE}
  </section>

  <div class="snap rise">
    <div class="sechead"><span>The deal</span><span></span></div>
    <div class="row"><span class="k">Product</span><span class="v">Gas oil EN 590 10ppm</span></div>
    <div class="row"><span class="k">Quantity</span><span class="v">30,000 MT</span></div>
    <div class="row"><span class="k">Origin</span><span class="v">Türkiye</span></div>
    <div class="row"><span class="k">Delivery</span><span class="v">CIF</span></div>
    <div class="row"><span class="k">HS code</span><span class="v">2710.19</span></div>
    <p class="note">Disclosed to you when your interest was accepted.</p>
  </div>

  <section class="rise">
    <div class="sechead"><span>Activity</span><span>Your branch</span></div>
    <div class="ac"><span class="w">09:14</span><span class="x">You accepted the participation agreement.</span></div>
    <div class="ac"><span class="w">Yesterday</span><span class="x">1402 Celsius proposed the procedure. Awaiting your agreement.</span></div>
    <div class="ac"><span class="w">4 Aug</span><span class="x">You were admitted to this room.</span></div>
  </section>

  <footer>No price, no branch count and no total appears on this screen. Neither exists in what your side of the room can read.</footer>`;
}

const p=document.getElementById("p"), capt=document.getElementById("capt");
const bO=document.getElementById("bOwner"), bP=document.getElementById("bParty");

function show(which){
  p.scrollTop=0;
  p.innerHTML = which==="owner"?ownerView():partyView();
  capt.textContent = which==="owner"?"the room · administrator":"the room · one counterparty branch";
  bO.classList.toggle("on",which==="owner"); bP.classList.toggle("on",which!=="owner");
  p.querySelectorAll(".rise").forEach((n,i)=>setTimeout(()=>n.classList.add("on"),70+i*100));
}
bO.onclick=()=>show("owner"); bP.onclick=()=>show("party");
show("owner");
</script>
</body>
</html>
