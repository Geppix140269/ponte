<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ponte — Set 2 · publish a listing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="brand/favicons/favicon-32.png" />
<link rel="stylesheet" href="ponte-flow/tokens/ponte-flow-tokens.css" />
<link rel="stylesheet" href="ponte-system.css" />
<link rel="stylesheet" href="ponte-bridge.css" />
<link rel="stylesheet" href="ponte-set1.css?v=2" />
<link rel="stylesheet" href="ponte-set2.css?v=1" />
<style>
html,body{height:100%}
body{background:#E8E4DA;margin:0;font-family:var(--f-sans);color:#0F0F0E}
.bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 20px;background:#0F0F0E;color:#F2EFE8;border-bottom:1px solid rgba(242,239,232,.18)}
.bar .t{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(242,239,232,.55)}
.bar select,.bar button{font-family:var(--f-mono);font-size:11px;background:#1B1B19;color:#F2EFE8;border:1px solid rgba(242,239,232,.24);border-radius:4px;padding:6px 9px;cursor:pointer}
.bar .m{margin-inline-start:auto;font-family:var(--f-mono);font-size:10.5px;color:rgba(242,239,232,.55)}
.head{padding:26px 22px 4px;max-width:104ch}
.head .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#8A6520;display:block;margin-bottom:9px}
.head h2{font-family:var(--f-serif);font-size:27px;font-weight:500;letter-spacing:-.018em;margin:0 0 9px}
.head p{font-size:13.5px;line-height:1.7;color:#3A3733;margin:0;text-wrap:pretty}
.sheet{display:flex;gap:26px;align-items:flex-start;padding:22px;overflow-x:auto;width:100%}
.cell{flex:none}
.pair{display:flex;align-items:stretch;border:1px solid #C9C2B0}
.pair>div{position:relative}
.pair>div+div{border-inline-start:1px solid #C9C2B0}
.cap{display:flex;align-items:baseline;gap:12px;padding:0 0 8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#6E6A61}
.cap b{color:#0F0F0E;font-size:11.5px}
.cap span{margin-inline-start:auto;text-transform:none;letter-spacing:.02em}
.doc{max-width:1080px;padding:24px 22px 70px}
.doc h1{font-family:var(--f-serif);font-size:32px;font-weight:500;letter-spacing:-.02em;margin:0 0 12px;max-width:26ch}
.doc h3{font-size:13px;font-weight:600;margin:34px 0 12px;padding-bottom:8px;border-bottom:1px solid #D5CEBC;font-family:var(--f-mono);letter-spacing:.13em;text-transform:uppercase;color:#6E6A61}
.doc p{font-size:13.5px;line-height:1.72;color:#3A3733;margin:0 0 12px;max-width:82ch;text-wrap:pretty}
.tt{width:100%;border-collapse:collapse;font-size:12.5px;background:#FCFBF7;border:1px solid #E5DFD2}
.tt th{text-align:start;font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#6E6A61;padding:9px 13px;background:#F2EFE6;border-bottom:1px solid #D5CEBC;font-weight:600}
.tt td{padding:10px 13px;border-bottom:1px solid #E5DFD2;color:#3A3733;line-height:1.55;vertical-align:top}
.tt tr:last-child td{border-bottom:0}
.tt td b{color:#0F0F0E}
.tt code,.doc code{font-family:var(--f-mono);font-size:11.5px;background:#F2EFE6;padding:1px 5px}
.intent{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:0 30px}
.intent li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:11px;padding:10px 0;border-bottom:1px dashed #D5CEBC;font-size:12.5px;line-height:1.6;color:#3A3733;text-wrap:pretty}
.intent li i{font-family:var(--f-mono);font-size:9.5px;font-style:normal;width:19px;height:19px;border-radius:50%;border:1px solid #6E6A61;color:#3A3733;display:flex;align-items:center;justify-content:center}
.intent li b{color:#0F0F0E}
</style>
</head>
<body>

<div class="bar" role="toolbar" aria-label="Review">
  <span class="t">Set 2 · publish a listing</span>
  <select id="sel" aria-label="Surface"></select>
  <span class="t">State</span>
  <select id="state" aria-label="State"></select>
  <span class="t">View</span>
  <select id="view" aria-label="View"><option value="pair">Light + dark</option><option value="light">Light only</option><option value="dark">Dark only</option></select>
  <button type="button" id="prev" aria-label="Previous">←</button>
  <button type="button" id="next" aria-label="Next">→</button>
  <span class="m" id="meta"></span>
</div>

<div id="stage"></div>

<template id="__bundler_thumbnail">
<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" fill="#0F0F0E"/><g transform="translate(30,32)"><rect x="0" y="0" width="18" height="2" fill="#F2EFE8"/><rect x="20" y="0" width="18" height="2" fill="#F2EFE8"/><rect x="40" y="0" width="20" height="2" fill="#3A3733"/><rect x="0" y="14" width="46" height="8" fill="#FCFBF7"/><rect x="0" y="32" width="60" height="1" fill="#6E6A61"/><circle cx="4" cy="44" r="4" fill="#FCFBF7"/><rect x="14" y="41" width="30" height="5" fill="#8A8579"/><rect x="0" y="56" width="60" height="1" fill="#6E6A61"/><circle cx="4" cy="68" r="4" fill="none" stroke="#8A8579" stroke-width="1.5"/><rect x="14" y="65" width="22" height="5" fill="#5A554C"/></g></svg>
</template>

<script src="ponte-set2-screens.js?v=1"></script>
<script>
(function(){
var P = window.PS2;
var NOTES = {
 B01:[
  '<b>Direction first, family second, position third</b> — revealed in sequence on one surface, so a first-time member answers one question at a time and never sees a six-way grid cold.',
  '<b>The shortcut is persistent, not a second screen.</b> All six opportunity types sit below the fold as a two-column set with their register codes, so a returning member skips the sequence entirely.',
  '<b>Position is mandatory and says why.</b> "Without it, two listings that are each other\u2019s counterparty look identical to two that are peers" \u2014 the four options are drawn as two matching pairs under Distribution and Representation, so the pairing is visible rather than asserted.',
  'The primary action stays disabled with its reason stated \u2014 "Required before this listing can be published" \u2014 rather than being hidden or silently inert.',
  'A previous choice is <b>offered, never applied</b>: "Ponte remembers, but it will not choose for you."'
 ],
 CAP:[
  '<b>It is a statement about the person, not the goods</b>, so it is a separate surface and never a line in the fact list. The heading is the sentence itself: "For this opportunity, I am acting as\u2026"',
  '<b>A previous answer is a suggestion that must be actively confirmed.</b> "Ponte has not applied this. Capacity can differ from one opportunity to the next, so it asks every time." Two equal actions, neither pre-selected.',
  '<b>Intermediary status is public, and the screen says so where it is declared</b> \u2014 not in the preview, not in terms. On confirmation it is stated in the plainest available form: "Ponte does not hide intermediary status and does not let you either."',
  'The <b>authority declaration appears inline</b> the moment representative or intermediary is chosen \u2014 named company plus an explicit confirmation of written authority, on the same surface, not as a follow-up step.'
 ],
 B06:[
  '<b>Visibility is per item, not per listing.</b> Each asset carries its own mark and states it in words on the row: public, on accepted interest, or private.',
  '<b>The three-degree ladder is a shape ladder</b> \u2014 filled circle, half circle, struck circle \u2014 so the degree survives with colour removed. It is the same ladder used in Deal Preview.',
  '<b>Nothing here is required to publish</b>, and the primary action says so: "Continue without assets \u2014 you can add them after publishing." Credibility is offered, not demanded.',
  '<b>No claim is made about what a document proves.</b> "Ponte does not check what a document claims. It shows buyers what you gave it and says where it came from."',
  'The upload disclosure carries the real retention policy \u2014 90 days from last edit, warnings at 14 and 3 days \u2014 and the drop target states the file is held against the account, because the route is signed-in only.'
 ],
 B07:[
  '<b>Three layers, in descending visibility</b>, each with a heading that explains the layer before any field appears. Public is a raised tone band; the other two sit on the surface.',
  '<b>The minimum public dataset is drawn as fixed.</b> Every public row carries "Fixed" in place of a control and the layer header carries a lock mark \u2014 there is no affordance to reduce it, because there is no such capability.',
  '<b>Mutual disclosure is stated twice</b>: once in the layer header, once on the identity surface. "Neither party sees the other\u2019s identity without giving their own."',
  '<b>Identity defaults to reveal-on-accepted-interest</b>, with showing publicly as an explicit, secondary choice \u2014 and the consequence is named: choosing public gives yours first.',
  '<b>Three family variants, one structure.</b> Product, trade service and distribution differ only in their field sets. Compare them state to state: the layers, the order and the treatments are identical.',
  'Validity sits here \u2014 60 days default, 90 maximum, and the <b>exact expiry date in words</b>. Date only, no time, no timezone.'
 ],
 B09:[
  '<b>A recognition, not a receipt.</b> <code>deal_published</code> maps to R2, so all five elements are present: milestone, what completed, why it matters, what remains preserved, and one next action with an owner.',
  '<b>The honest next step is in the recognition itself</b>, not buried: "Nothing about publishing guarantees a response \u2014 Ponte can make you findable, not wanted."',
  'The fourth element does real work: it names <b>what stays private</b> \u2014 price, certificate, notes \u2014 and restates that identity is disclosed only on mutual acceptance.',
  '<b>Reference and expiry are facts on the surface</b>: <code>PT-4482-08</code> and 1 October 2026, each labelled with its visibility.',
  'The perimeter statement sits directly under the recognition, so the good news and its limit are read together rather than on different screens.'
 ],
 SCREEN:[
  '<b>Checked, never Approved, Vetted or Reviewed.</b> The word appears as the status on every passing row and as the heading of the passing state.',
  '<b>Automated-first is stated, not implied</b>: "Seconds, not days" and "Automated. Nobody is queued to look at this." A person is named in exactly one place \u2014 the appeal route on a refusal \u2014 where a person genuinely reads it.',
  '<b>The perimeter is named on every screening state.</b> "Ponte runs sanctions and prohibited-goods lists and tests for completeness and internal consistency. It does not verify your counterparty, inspect your goods, or confirm that anything a document claims is true. A checked listing is a complete one, not a safe one."',
  '<b>A duplicate is your call, not a refusal.</b> Ponte states the cost of publishing both and offers to do it anyway \u2014 the finding is explained, the decision is the member\u2019s.',
  '<b>A refusal is about the category, not the person</b>: "This is a rule about the category, not a judgement about you or your company." The draft survives, privately.',
  '<b>A failed check is never a pass.</b> "Ponte does not publish on an incomplete check", and the recovery starts from the two that did not run.'
 ]
};

var ITEMS = P.order.map(function(k){ return { k:k, s:P[k] }; });
ITEMS.push({ k:'notes', s:{ n:'\u2014', id:'', title:'Set 2 notes' } });

var sel = document.getElementById('sel'), view = document.getElementById('view'),
    stSel = document.getElementById('state'), stage = document.getElementById('stage'),
    meta = document.getElementById('meta');
var cur = 0, mode = 'pair', curState = null;
sel.innerHTML = ITEMS.map(function(it,i){
  return '<option value="'+i+'">'+(it.s.n==='\u2014'?'':it.s.n+' \u00b7 ')+it.s.title+'</option>'; }).join('');

function cap(a,b){ return '<div class="cap"><b>'+a+'</b><span>'+b+'</span></div>'; }
function sheet(s){
  var list = curState === '*' ? s.states : s.states.filter(function(x){ return x[0] === curState; });
  return '<div class="sheet">'+list.map(function(st){
    var l = '<div>'+s.build(st[0],'light')+'</div>', d = '<div>'+s.build(st[0],'dark')+'</div>';
    var inner = mode==='light' ? l : mode==='dark' ? d : l+d;
    return '<div class="cell">'+cap(st[1], mode==='pair'?'light \u00b7 dark':mode)+'<div class="pair">'+inner+'</div></div>';
  }).join('')+'</div>';
}

function notesDoc(){
  var rows = function(t){ return t.map(function(r){ return '<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>'; }).join(''); };
  return '<div class="doc"><span class="k" style="font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#8A6520">Set 2</span>'
  + '<h1>Publish a listing, end to end, in all three families</h1>'
  + '<p>Six surfaces, 29 states, both themes, 390px. Set 2 uses the Set 1 patterns and changes none of them: the segmented journey rule, the fact-line hierarchy, correction in place, the saved / not-saved register and the R2 recognition band are all inherited as drawn. <b>If revision A alters a pattern, Set 2 inherits it</b> \u2014 the two sets share <code>ponte-set1.css</code>, and <code>ponte-set2.css</code> only adds what Set 1 had no need for.</p>'

  + '<h3>What Set 2 adds to the system</h3>'
  + '<table class="tt"><thead><tr><th style="width:190px">Addition</th><th style="width:250px">Why it was needed</th><th>How it holds the laws</th></tr></thead><tbody>'
  + rows([
    ['Visibility ladder','Three degrees of exposure had to be legible at a glance, on every row, in both themes','Shape, not colour: filled circle (public), half circle (on accepted interest), struck circle (private). Stated in words on every row as well.'],
    ['Layer groups','Deal Preview needed three bands that explain themselves before any field appears','Headings plus hairlines. The public layer is a raised tone, not a card. No border encloses a group.'],
    ['Asset rows','Item-level visibility needs a thumbnail, a name and a visibility statement in one 64px row','A flat tone rectangle with a hairline, no radius, no shadow. It is a tone shift, not a card.'],
    ['Suggestion band','A previous answer must be offered and actively confirmed, never applied','Raised tone, two equal underlined actions, neither pre-selected. The band states that Ponte has not applied it.'],
    ['Authority declaration','Representative and intermediary need a named company and an explicit confirmation, inline','Attention wash, a real 48px checkbox row, a full-width underlined field. Same treatment as a tier-1 missing fact.'],
    ['Screening rows','Four screening states needed a per-check status that never reads as human review','Mark plus a mono status word. Only ever Checked, Running, Waiting, Your call or Did not run.'],
    ['Validity pills','60 / 30 / 90 with the exact date','Hairline-bordered pills at 48px, one filled when selected. The date is stated in prose beneath, not encoded in the pill.']])
  + '</tbody></table>'

  + '<h3>Copy constraints, held</h3>'
  + '<table class="tt"><thead><tr><th style="width:190px">Constraint</th><th colspan="2">Where Set 2 is exposed to it, and what it says</th></tr></thead><tbody>'
  + [['Never claim comprehensive screening','The perimeter statement appears on every screening state and again on the confirmation: Ponte runs sanctions and prohibited-goods lists and tests completeness and internal consistency, and <b>does not verify your counterparty, inspect your goods, or confirm what a document claims</b>. The sentence that carries it: \u201cA checked listing is a complete one, not a safe one.\u201d'],
     ['Checked, never Approved','\u201cChecked\u201d is the only pass word in the set, as row status and as heading. Approved, Vetted, Reviewed and Verified do not appear.'],
     ['Retention stated','Unauthenticated states carry the 7-day line verbatim. Signed-in states carry 90 days from last edit, and the asset disclosure carries the full policy including the 14-day and 3-day warnings.'],
     ['No anonymous uploads','B06 is a signed-in surface throughout. The drop target states files are held against the account.'],
     ['Publish means public and free','The primary action is \u201cPublish\u201d and its sub-label is \u201cPublic and free. Anyone can find it.\u201d <b>Activate does not appear in Set 2</b>, because no paid action exists in this capability.'],
     ['No promised outcome','\u201cPonte can make you findable, not wanted.\u201d The confirmation states plainly that responses may or may not come.']]
     .map(function(r){ return '<tr><td><b>'+r[0]+'</b></td><td colspan="2">'+r[1]+'</td></tr>'; }).join('')
  + '</tbody></table>'

  + '<h3>Momentum</h3>'
  + '<p><b>R2 <code>deal_published</code> is B09</b>, drawn with all five elements. R1 and RX are inherited from Set 1 and carried throughout: every storage line is R1, and every failure state in Set 2 carries the saved / not-saved register with a reference and a timestamp and a recovery that continues rather than restarts. <b>No R3 or R4 appears</b> \u2014 those are commercial milestones and they live in the Deal Room.</p>'
  + '<p>Note one deliberate restraint: the duplicate-listing state is <b>not</b> a recognition and is not treated as one. It is a finding that hands the member a decision, so it takes the attention wash and two equal routes, not a milestone band.</p>'

  + '<h3>The journey rule in Set 2</h3>'
  + '<p>Set 1 drew three segments for a three-step journey. <b>Set 2 draws five</b>, because publishing is five steps: intent and capacity, tell Ponte, the listing so far, assets, preview and publish. The rule still carries <b>no numeral and no percentage</b> \u2014 a segment is filled or it is not \u2014 and the step count sits beside it in words, as approved. The form remains distinct from anything the Deal Room will use for procedural completion.</p>'

  + '<h3>Flagged, not assumed</h3>'
  + '<p><b>B06 is drawn in full rather than minimal.</b> The depth lever was offered for this surface, and I have drawn the complete version because item-level visibility is not a depth question \u2014 it is the mechanism that makes the three-layer preview true. If a member can only set visibility for the whole listing, the private layer becomes a promise Ponte cannot keep. What can be cut here is the number of asset types and any editing beyond add and remove; the visibility control cannot.</p>'
  + '<p><b>Capacity is drawn as its own surface, not as part of B01.</b> The brief lists it as a new surface, and the sequence works either way, but it is placed after deal intent and before Tell Ponte so that capacity is answered while the member is still describing themselves rather than their goods. Say if you want it merged into B01\u2019s progressive reveal.</p>'
  + '<p><b>The duplicate check is my addition.</b> The brief specified four screening states and named the outcomes rather than the checks. Running, Checked, Refused and a service failure are the four; \u201cneeds something from you\u201d is drawn as a fifth because a duplicate is neither a pass nor a refusal and had nowhere else to live. Cut it if the check does not exist in v1.</p>'
  + '<p><b>Position options.</b> The four options are drawn as seeking / offering a distributor and seeking / offering an agent, forming the two matching pairs the brief requires. The pairing table did not survive into the brief I received \u2014 confirm the labels are the ones you intended.</p>'
  + '</div>';
}

function paint(){
  var it = ITEMS[cur], s = it.s;
  Array.prototype.forEach.call(sel.options, function(o){ o.selected = parseInt(o.value,10) === cur; });
  view.disabled = it.k === 'notes'; stSel.disabled = it.k === 'notes';
  if(it.k === 'notes'){ stage.innerHTML = notesDoc(); }
  else {
    var keys = s.states.map(function(x){ return x[0]; });
    if(curState !== '*' && keys.indexOf(curState) < 0) curState = keys[0];
    stSel.innerHTML = s.states.map(function(x){
      return '<option value="'+x[0]+'"'+(x[0]===curState?' selected':'')+'>'+x[1]+'</option>'; }).join('')
      + '<option value="*"'+(curState==='*'?' selected':'')+'>All states</option>';
    stage.innerHTML = '<div class="head"><span class="k">'+s.id+' \u00b7 '+s.states.length+' states \u00b7 390 px</span>'
      + '<h2>'+s.title+'</h2><p>'+s.purpose+'</p>'
      + '<ul class="intent">'+NOTES[it.k].map(function(n,i){ return '<li><i>'+(i+1)+'</i><span>'+n+'</span></li>'; }).join('')+'</ul></div>'
      + sheet(s);
  }
  meta.textContent = (cur+1)+' / '+ITEMS.length;
  window.scrollTo(0,0);
}
function go(i){ cur = (i + ITEMS.length) % ITEMS.length; paint(); }
sel.addEventListener('change', function(){ go(parseInt(sel.value,10)); });
stSel.addEventListener('change', function(){ curState = stSel.value; paint(); });
view.addEventListener('change', function(){ mode = view.value; paint(); });
document.getElementById('prev').addEventListener('click', function(){ go(cur-1); });
document.getElementById('next').addEventListener('click', function(){ go(cur+1); });
document.addEventListener('keydown', function(e){
  if(e.target.tagName === 'SELECT') return;
  if(e.key === 'ArrowRight') go(cur+1);
  if(e.key === 'ArrowLeft') go(cur-1);
});
go(0);
})();
</script>
</body>
</html>
